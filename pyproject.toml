[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyfin"
version = "0.1.0"
description = "VERIFY-FIN: A Claim-Level Grounding Framework for Hallucination Mitigation in Multi-Agent LLM Financial Analysis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["verifyfin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
